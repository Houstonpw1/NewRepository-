<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Houston Pressure Washing</title>
    <script type="text/javascript">
      // Check if the 404 is happening on an extension-less image route
      var path = window.location.pathname;
      if (path.includes('before-after') || path.includes('service-') || path.includes('hero') || path.includes('horizontal')) {
        // Silently route the browser straight to your clean media folder asset
        var filename = path.substring(path.lastIndexOf('/') + 1);
        var extension = filename.includes('logo') || filename.includes('before-after') ? '.png' : '.jpg';
        if (filename.includes('cleaning') || filename.includes('building')) extension = '.png';
        window.location.replace('/media/' + filename + extension);
      } else {
        // Otherwise, preserve the Single Page App state
        window.location.replace('/');
      }
    </script>
  </head>
  <body>
  </body>
</html>
