<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Houston Pressure Washing</title>
    <script type="text/javascript">
      var path = window.location.pathname;
      var filename = path.substring(path.lastIndexOf('/') + 1);

      // ── LOGO ROUTING ──
      if (path.includes('horizontal') || filename.includes('logo')) {
        window.location.replace('/airo-assets/uploads/logo-horizontal-421a29e0.png');
      } 
      // ── HERO & SERVICE IMAGES ROUTING ──
      else if (path.includes('before-after') || path.includes('service-') || path.includes('hero')) {
        // Strip out any accidental extensions added by the browser to match your extensionless files
        var cleanName = filename.replace(/\.(png|jpg|jpeg|PNG|JPG|JPEG)$/, '');
        window.location.replace('/airo-assets/images/pages/home/' + cleanName);
      } 
      // ── FALLBACK FOR STANDARD SITE PAGES ──
      else {
        window.location.replace('/');
      }
    </script>
  </head>
  <body>
  </body>
</html>
